[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "trade-research"
version = "0.1.0"
description = "Local, research-only investment analysis framework"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "pydantic==2.11.7",
  "pyarrow==18.1.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.3.5",
  "ruff==0.12.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
