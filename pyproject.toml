[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "trade-research"
version = "0.1.0"
description = "Local, research-only investment analysis framework"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "backtesting==0.6.6",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "mcp==1.12.4",
  "pydantic==2.11.7",
  "pyarrow==18.1.0",
  "typer==0.16.0",
  "uvicorn==0.35.0",
]

[project.optional-dependencies]
bloomberg = ["blpapi>=3.24"]
crypto = ["ccxt>=4.0"]
showcase = ["streamlit==1.62.0"]
dev = [
  "build==1.3.0",
  "mypy==1.17.1",
  "pytest==8.3.5",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.9",
]

[project.scripts]
trade-research = "trade_research.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = [
  "backtesting",
  "backtesting.*",
  "blpapi",
  "blpapi.*",
  "mcp",
  "mcp.*",
  "pandas",
  "pandas.*",
  "pyarrow",
  "pyarrow.*",
]
ignore_missing_imports = true
