services:
  research-api:
    image: trade-research:local
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    command: ["trade-research", "serve", "--host", "0.0.0.0", "--port", "8000"]
    read_only: true
    init: true
    restart: unless-stopped
    environment:
      TRADE_RESEARCH_API_TOKEN_FILE: /run/secrets/api-token
      TRADE_RESEARCH_CONTAINER_INTERNAL_BIND: compose-internal-v1
      TRADE_RESEARCH_CONFIG: ${TRADE_RESEARCH_CONFIG:-/var/lib/trade-research-sources/config.json}
      TRADE_RESEARCH_DATA_DIR: /var/lib/trade-research
      TRADE_RESEARCH_PRICE_PROVIDER: ${TRADE_RESEARCH_PRICE_PROVIDER:-}
      TRADE_RESEARCH_PRICE_PATH: ${TRADE_RESEARCH_PRICE_PATH:-}
      TRADE_RESEARCH_FUNDAMENTAL_PROVIDER: ${TRADE_RESEARCH_FUNDAMENTAL_PROVIDER:-}
      TRADE_RESEARCH_FUNDAMENTAL_PATH: ${TRADE_RESEARCH_FUNDAMENTAL_PATH:-}
      TRADE_RESEARCH_SEC_USER_AGENT: ${TRADE_RESEARCH_SEC_USER_AGENT:-}
      TRADE_RESEARCH_DATA_ROOT: /var/lib/trade-research
      TRADE_RESEARCH_CCXT_EXCHANGE: ${TRADE_RESEARCH_CCXT_EXCHANGE:-}
    secrets:
      - source: api-token
        target: api-token
        mode: 0444
    tmpfs:
      - /tmp
    volumes:
      - research-data:/var/lib/trade-research
      - type: bind
        source: ${TRADE_RESEARCH_SOURCE_DIR:-./sources}
        target: /var/lib/trade-research-sources
        read_only: true

  research-worker:
    image: trade-research:local
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim}
    command: ["trade-research", "worker"]
    read_only: true
    init: true
    restart: unless-stopped
    environment:
      TRADE_RESEARCH_DATA_DIR: /var/lib/trade-research
      TRADE_RESEARCH_CONFIG: ${TRADE_RESEARCH_CONFIG:-/var/lib/trade-research-sources/config.json}
      TRADE_RESEARCH_PRICE_PROVIDER: ${TRADE_RESEARCH_PRICE_PROVIDER:-}
      TRADE_RESEARCH_PRICE_PATH: ${TRADE_RESEARCH_PRICE_PATH:-}
      TRADE_RESEARCH_FUNDAMENTAL_PROVIDER: ${TRADE_RESEARCH_FUNDAMENTAL_PROVIDER:-}
      TRADE_RESEARCH_FUNDAMENTAL_PATH: ${TRADE_RESEARCH_FUNDAMENTAL_PATH:-}
      TRADE_RESEARCH_SEC_USER_AGENT: ${TRADE_RESEARCH_SEC_USER_AGENT:-}
      TRADE_RESEARCH_DATA_ROOT: /var/lib/trade-research
      TRADE_RESEARCH_CCXT_EXCHANGE: ${TRADE_RESEARCH_CCXT_EXCHANGE:-}
    tmpfs:
      - /tmp
    volumes:
      - research-data:/var/lib/trade-research
      - type: bind
        source: ${TRADE_RESEARCH_SOURCE_DIR:-./sources}
        target: /var/lib/trade-research-sources
        read_only: true

  hermes:
    profiles: ["hermes"]
    image: ${HERMES_IMAGE:-trade-research:local}
    entrypoint: ["/trade-research/hermes-entrypoint"]
    read_only: true
    init: true
    restart: unless-stopped
    depends_on:
      research-api:
        condition: service_started
    environment:
      HERMES_IMAGE_CONFIGURED: ${HERMES_IMAGE:-}
      TRADE_RESEARCH_API_URL: http://research-api:8000
      TRADE_RESEARCH_API_TOKEN_FILE: /run/secrets/api-token
    secrets:
      - source: api-token
        target: api-token
        mode: 0444
    tmpfs:
      - /tmp
    volumes:
      - ./scripts/hermes-entrypoint:/trade-research/hermes-entrypoint:ro

volumes:
  research-data:

secrets:
  api-token:
    file: ${TRADE_RESEARCH_API_TOKEN_FILE_SOURCE:-./secrets/api-token}
