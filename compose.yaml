services:
  research-api:
    build: .
    command: ["trade-research", "serve", "--host", "0.0.0.0", "--port", "8000"]
    read_only: true
    init: true
    restart: unless-stopped
    environment:
      TRADE_RESEARCH_API_TOKEN_FILE: /run/secrets/api-token
      TRADE_RESEARCH_DATA_DIR: /var/lib/trade-research
      TRADE_RESEARCH_PROVIDER: ${TRADE_RESEARCH_PROVIDER:-}
    secrets:
      - source: api-token
        target: api-token
        mode: 0444
    tmpfs:
      - /tmp
    volumes:
      - research-data:/var/lib/trade-research

  research-worker:
    build: .
    command: ["trade-research", "worker"]
    read_only: true
    init: true
    restart: unless-stopped
    environment:
      TRADE_RESEARCH_DATA_DIR: /var/lib/trade-research
      TRADE_RESEARCH_PROVIDER: ${TRADE_RESEARCH_PROVIDER:-}
    tmpfs:
      - /tmp
    volumes:
      - research-data:/var/lib/trade-research

volumes:
  research-data:

secrets:
  api-token:
    file: ${TRADE_RESEARCH_API_TOKEN_FILE_SOURCE:-./secrets/api-token}
